{% extends "base.html" %}

{% block title %}Accès Espace Pro — Pizza Time{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 440px; margin: 4rem auto; border-top: 3px solid var(--primary-color); padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 58px; height: 58px; margin: 0 auto 1.25rem; border-radius: 16px; background: rgba(255, 59, 83, 0.12); border: 1px solid rgba(255, 59, 83, 0.3); display: flex; align-items: center; justify-content: center; color: var(--primary-color);">
            <svg class="icon icon-lg" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </div>
        <h2 style="margin: 0 0 0.4rem; color: #ffffff; font-size: 1.6rem; letter-spacing: 0.8px;">Accès Espace Pro</h2>
        <p style="margin: 0; color: var(--text-muted); font-size: 0.88rem;">Administration & Kitchen Display System</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" placeholder="admin ou staff" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" style="width: 100%; margin-top: 0.5rem; font-size: 0.95rem; padding: 1.05rem;">
            <span>Connexion Sécurisée</span>
            <svg class="icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);">
        <span>Admin: <strong style="color: #cbd5e1;">admin / admin123</strong></span>
        <span>Cuisine: <strong style="color: #cbd5e1;">staff / staff123</strong></span>
    </div>
</div>
{% endblock %}
