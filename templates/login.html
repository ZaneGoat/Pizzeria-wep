{% extends "base.html" %}

{% block title %}Connexion Espace Pro — Chef Amin Pizzeria{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 460px; margin: 4rem auto; border-top: 4px solid var(--primary-color); padding: 2.5rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
        <div style="width: 64px; height: 64px; margin: 0 auto 1rem; border-radius: 18px; background: rgba(255, 71, 87, 0.15); border: 1px solid rgba(255, 71, 87, 0.35); display: flex; align-items: center; justify-content: center; font-size: 2rem;">
            🔐
        </div>
        <h2 style="margin: 0 0 0.4rem; color: #ffffff; font-size: 1.65rem;">Accès Espace Pro</h2>
        <p style="margin: 0; color: var(--text-muted); font-size: 0.9rem;">Administration & Contrôle Cuisine</p>
    </div>

    <form method="POST">
        <div class="form-group">
            <label for="username">Identifiant</label>
            <input type="text" id="username" name="username" placeholder="Ex: admin ou staff" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" style="width: 100%; margin-top: 0.75rem; font-size: 1rem; padding: 1.05rem;">
            SE CONNECTER →
        </button>
    </form>

    <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-muted);">
        <span>Admin: <strong style="color: #cbd5e1;">admin / admin123</strong></span>
        <span>Cuisine: <strong style="color: #cbd5e1;">staff / staff123</strong></span>
    </div>
</div>
{% endblock %}
